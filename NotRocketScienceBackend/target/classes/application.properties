spring.application.name=jrs-rocket-service

spring.application.name=jrs-rocket-service

# PostgreSQL DataSource
spring.datasource.url=jdbc:postgresql://localhost:5433/jrs_rocket_db
spring.datasource.username=jrs_user
spring.datasource.password=jrs_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.connect-retries=30

# Hikari Connection Pool
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=30000

# Server
server.port=${PORT:8082}

server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always
